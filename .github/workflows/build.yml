# Minden feltöltés (push) után a GitHub lefordítja az APK-t, és kiadásként (Release) közzéteszi,
# így telefonról közvetlenül letölthető és telepíthető: a repó "Releases" részében a legfrissebb.
name: APK építés

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK fordítása
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Átnevezés
        run: cp app/build/outputs/apk/release/app-release.apk GlassBrowser-${{ github.run_number }}.apk

      - name: Kiadás (letölthető APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glass Browser – build ${{ github.run_number }}
          files: GlassBrowser-${{ github.run_number }}.apk
          make_latest: true
